# GitLab CE omnibus: one pod runs the whole stack (nginx, puma, sidekiq,
# gitaly, postgresql, redis). Reachable in-cluster at
# http://gitlab.gitlab.svc.cluster.local, the URL Argo CD clones from.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-root
  namespace: gitlab
type: Opaque
stringData:
  # Initial "root" password. Local only: GitLab is not published outside the
  # cluster, it is reached through kubectl port-forward.
  password: "Iot-Kubernetes-2026"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 12Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  # The volumes are single-writer, so never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-root
                  key: password
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.gitlab.svc.cluster.local'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                # Probes come from the node IP, and /-/health is restricted
                # to localhost by default.
                gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
                # Components a single-node setup does not need.
                prometheus_monitoring['enable'] = false
                registry['enable'] = false
                gitlab_kas['enable'] = false
                puma['worker_processes'] = 2
                postgresql['shared_buffers'] = '256MB'
          ports:
            - name: http
              containerPort: 80
          # First boot runs the full reconfigure + migrations, so give it room.
          startupProbe:
            httpGet:
              path: /-/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /-/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab
            - name: data
              mountPath: /var/opt/gitlab
            - name: logs
              mountPath: /var/log/gitlab
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: gitlab-config
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: logs
          emptyDir: {}
        # PostgreSQL needs more shared memory than the default 64 MiB.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: http
